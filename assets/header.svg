<svg viewBox="0 0 800 170" xmlns="http://www.w3.org/2000/svg">
  <title>Abhishek Soni</title>
  <rect width="100%" height="100%" fill="#0d1117" rx="6"/>
  
  <text x="400" y="55" text-anchor="middle" dominant-baseline="middle"
        font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"
        font-size="36" font-weight="600" fill="#f0f6fc" letter-spacing="-2">
    Abhishek Soni
  </text>
  
  <line x1="300" y1="72" x2="500" y2="72" stroke="#30363d" stroke-width="1"/>
  
  <!-- Role Spine -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"
     font-size="13" fill="#58a6ff" text-anchor="middle" dominant-baseline="middle">
    
    <!-- Main spine -->
    <line x1="90" y1="105" x2="710" y2="105" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Nodes -->
    <circle cx="150" cy="105" r="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="300" cy="105" r="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="460" cy="105" r="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="600" cy="105" r="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="680" cy="105" r="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    
    <!-- Drops -->
    <line x1="150" y1="105" x2="150" y2="122" stroke="#30363d" stroke-width="1"/>
    <line x1="300" y1="105" x2="300" y2="122" stroke="#30363d" stroke-width="1"/>
    <line x1="460" y1="105" x2="460" y2="122" stroke="#30363d" stroke-width="1"/>
    <line x1="600" y1="105" x2="600" y2="122" stroke="#30363d" stroke-width="1"/>
    <line x1="680" y1="105" x2="680" y2="122" stroke="#30363d" stroke-width="1"/>
    
    <!-- Titles -->
    <text x="150" y="135">AI Engineer</text>
    <text x="300" y="135">Software Engineer</text>
    <text x="460" y="135">Full Stack Developer</text>
    <text x="600" y="135">Data Analyst</text>
    <text x="680" y="135">Researcher</text>
  </g>
</svg>
